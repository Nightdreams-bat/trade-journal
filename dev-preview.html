<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tradejournal — browser preview</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- Shared "liquid glass" displacement filter (mirrors index.html). -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <filter id="liquid-glass-bend" x="-30%" y="-30%" width="160%" height="160%" filterUnits="objectBoundingBox">
          <feTurbulence type="fractalNoise" baseFrequency="0.004 0.008" numOctaves="2" seed="7" result="noise" />
          <feGaussianBlur in="noise" stdDeviation="4.5" result="softNoise" />
          <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="14" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="liquid-glass-bend-strong" x="-40%" y="-40%" width="180%" height="180%" filterUnits="objectBoundingBox">
          <feTurbulence type="fractalNoise" baseFrequency="0.003 0.006" numOctaves="2" seed="4" result="noise" />
          <feGaussianBlur in="noise" stdDeviation="5" result="softNoise" />
          <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="22" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <!--
      Dev-only harness: runs the real React app in a plain browser by stubbing
      the Electron `window.api` bridge with generated demo data. Lets us screenshot
      the UI (liquid glass, ambient room, rails) without packaging Electron.
      Open http://localhost:5173/dev-preview.html
    -->
    <script>
      (() => {
        const today = new Date()
        const iso = (d) => d.toISOString().slice(0, 10)
        const daysAgo = (n) => { const d = new Date(today); d.setDate(d.getDate() - n); return d }

        // deterministic-ish equity walk
        let cum = 0
        const equityCurve = []
        const calendar = {}
        const dailyBars = []
        for (let i = 60; i >= 0; i--) {
          const day = daysAgo(i)
          const pnl = Math.round((Math.sin(i * 0.7) * 320 + (i % 5 === 0 ? -450 : 180) + (Math.random() - 0.4) * 260))
          cum += pnl
          equityCurve.push({ date: iso(day), cumulativePnl: cum })
          if (day.getDay() !== 0 && day.getDay() !== 6) {
            calendar[iso(day)] = { pnl, count: 1 + (i % 3) }
            if (i < 21) dailyBars.push({ day: iso(day), pnl })
          }
        }
        let peak = -Infinity
        const ddSeries = equityCurve.map((p) => {
          peak = Math.max(peak, p.cumulativePnl)
          return { date: p.date, drawdown: +(p.cumulativePnl - peak).toFixed(0) }
        })
        const maxDrawdown = Math.min(...ddSeries.map((d) => d.drawdown))

        // Mirrors electron/drawdown.ts closely enough to exercise the drawdown UI in the browser.
        const START_BALANCE = 100000
        const ddDetail = (() => {
          const series = []
          const episodes = []
          let hwm = START_BALANCE
          let hwmDate = null
          let open = null
          const dayCount = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000)
          for (const p of equityCurve) {
            const equity = START_BALANCE + p.cumulativePnl
            if (equity >= hwm) {
              if (open) {
                episodes.push({
                  peakDate: open.peakDate, troughDate: open.troughDate, recoveryDate: p.date,
                  depthAbs: +open.depthAbs.toFixed(2), depthPct: +open.depthPct.toFixed(2),
                  durationDays: dayCount(open.peakDate, open.troughDate),
                  recoveryDays: dayCount(open.troughDate, p.date), ongoing: false,
                })
                open = null
              }
              hwm = equity
              hwmDate = p.date
              series.push({ date: p.date, equity: +equity.toFixed(2), drawdownAbs: 0, drawdownPct: 0 })
              continue
            }
            const abs = equity - hwm
            const pct = (abs / hwm) * 100
            if (!open) open = { peakDate: hwmDate ?? equityCurve[0].date, troughDate: p.date, depthAbs: abs, depthPct: pct }
            else if (abs < open.depthAbs) { open.troughDate = p.date; open.depthAbs = abs; open.depthPct = pct }
            series.push({ date: p.date, equity: +equity.toFixed(2), drawdownAbs: +abs.toFixed(2), drawdownPct: +pct.toFixed(2) })
          }
          if (open) {
            episodes.push({
              peakDate: open.peakDate, troughDate: open.troughDate, recoveryDate: null,
              depthAbs: +open.depthAbs.toFixed(2), depthPct: +open.depthPct.toFixed(2),
              durationDays: dayCount(open.peakDate, open.troughDate), recoveryDays: null, ongoing: true,
            })
          }
          const worst = episodes.reduce((a, b) => (!a || b.depthAbs < a.depthAbs ? b : a), null)
          const recovered = episodes.filter((e) => e.recoveryDays != null)
          const mean = (xs) => (xs.length ? xs.reduce((s, v) => s + v, 0) / xs.length : 0)
          const ddPcts = series.map((p) => Math.abs(p.drawdownPct))
          const ulcer = Math.sqrt(mean(ddPcts.map((v) => v * v)))
          const annualised = 14.2 // demo history is too short to annualise honestly; a plausible stand-in
          const depths = episodes.map((e) => Math.abs(e.depthPct)).sort((a, b) => a - b)
          const q = (f) => (depths.length ? -+depths[Math.min(depths.length - 1, Math.floor((depths.length - 1) * f))].toFixed(2) : 0)
          return {
            percentAvailable: true,
            series,
            maxDrawdownAbs: worst ? worst.depthAbs : 0,
            maxDrawdownPct: worst ? worst.depthPct : 0,
            peakDate: worst ? worst.peakDate : null,
            troughDate: worst ? worst.troughDate : null,
            recoveryDate: worst ? worst.recoveryDate : null,
            episodes,
            avgDepthPct: +mean(episodes.map((e) => e.depthPct)).toFixed(2),
            avgDurationDays: +mean(episodes.map((e) => e.durationDays)).toFixed(1),
            avgRecoveryDays: +mean(recovered.map((e) => e.recoveryDays)).toFixed(1),
            depthPercentiles: { p50: q(0.5), p75: q(0.75), p90: q(0.9), p95: q(0.95) },
            episodesOver: {
              pct5: episodes.filter((e) => Math.abs(e.depthPct) >= 5).length,
              pct10: episodes.filter((e) => Math.abs(e.depthPct) >= 10).length,
              pct20: episodes.filter((e) => Math.abs(e.depthPct) >= 20).length,
            },
            currentDrawdown: open
              ? { inDrawdown: true, depthAbs: +open.depthAbs.toFixed(2), depthPct: +open.depthPct.toFixed(2), daysInDrawdown: dayCount(open.peakDate, equityCurve[equityCurve.length - 1].date), peakDate: open.peakDate }
              : { inDrawdown: false, depthAbs: 0, depthPct: 0, daysInDrawdown: 0, peakDate: null },
            timeUnderwaterPct: +((series.filter((p) => p.drawdownAbs < 0).length / series.length) * 100).toFixed(1),
            tradingDays: series.length,
            calendarDays: 61,
            annualisedReturnPct: annualised,
            painIndex: +mean(ddPcts).toFixed(2),
            ulcerIndex: +ulcer.toFixed(2),
            calmar: worst ? +(annualised / Math.abs(worst.depthPct)).toFixed(2) : null,
            sterling: null,
            burke: +(annualised / Math.sqrt(episodes.reduce((s, e) => s + e.depthPct * e.depthPct, 0))).toFixed(2),
            martin: +(annualised / ulcer).toFixed(2),
            benchmarkSeries: null,
          }
        })()

        const summary = {
          kpis: { winRate: 58, totalPnl: cum, returnsPct: 8.3, profitFactor: 1.94 },
          radar: [
            { metric: 'Win Rate', value: 58 },
            { metric: 'Profit Factor', value: 72 },
            { metric: 'Consistency', value: 64 },
            { metric: 'Risk Mgmt', value: 81 },
            { metric: 'Discipline', value: 69 },
            { metric: 'Recovery', value: 55 },
          ],
          equityCurve,
          drawdown: { series: ddSeries, maxDrawdown },
          drawdownDetail: ddDetail,
          dailyBars,
          dayOfWeek: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].map((d, i) => ({
            day: d, trades: 12 - i, pnl: [1240, -320, 880, 210, 1510][i], winRate: [61, 44, 58, 52, 67][i],
          })),
          calendar,
          monthlyStats: {
            winRate: 58, riskReward: 1.7, profitFactor: 1.94,
            bestDayPnl: 1510, worstDayPnl: -980, avgDailyPnl: 156, tradeCount: 84,
          },
          insights: [
            'Your win rate on Fridays (67%) is well above your weekly average.',
            'Tuesday is consistently your weakest day — consider trading smaller size.',
            'Largest drawdown this period was ' + maxDrawdown.toLocaleString() + '.',
          ],
          overall: { winRate: 57, profitFactor: 1.88, totalPnl: 18420, returnsPct: 18.4, avgWin: 420, avgLoss: 240, totalTrades: 312 },
        }

        const accounts = [
          { id: 1, name: 'FTMO 100K', broker: 'FTMO', starting_balance: 100000, currency: 'USD', account_type: 'prop' },
          { id: 2, name: 'Personal', broker: 'IC Markets', starting_balance: 15000, currency: 'USD', account_type: 'live' },
        ]
        const strategies = [
          { id: 1, name: 'ICT Silver Bullet', description: 'London/NY killzone FVG entries' },
          { id: 2, name: 'Trend pullback', description: '20/50 EMA continuation' },
        ]
        const confluences = [
          { id: 1, name: 'FVG' }, { id: 2, name: 'OB' }, { id: 3, name: 'Liquidity sweep' },
          // a slice of the market-context pack, so the Market Context panel has something to rank
          { id: 4, name: 'Gap up' }, { id: 5, name: 'Gap continuation' },
          { id: 6, name: 'Relative volume high' }, { id: 7, name: 'Volume climax' },
          { id: 8, name: 'Above VWAP' }, { id: 9, name: 'VWAP reclaim' },
          { id: 10, name: 'High-impact news window' }, { id: 11, name: 'Trending' }, { id: 12, name: 'Choppy' },
        ]
        const mkTrade = (id, back, pair, direction, pnl, r, followed, ctx) => ({
          id,
          name: pair + ' ' + direction,
          date: iso(daysAgo(back)),
          pair,
          session: 'London',
          direction,
          risk_per_trade: 1,
          pnl,
          r_multiple: r,
          followed_plan: followed,
          break_even: false,
          entry_win: pnl >= 0,
          strategy_id: 1,
          account_id: 1,
          positive_tags: followed ? ['A+ setup'] : [],
          negative_tags: followed ? [] : ['early entry'],
          notes: null,
          created_at: new Date().toISOString(),
          confluence_ids: ctx ? [1, 2].concat(ctx) : [1, 2],
        })
        const PAIRS = ['EURUSD', 'GBPUSD', 'XAUUSD', 'NAS100', 'US30', 'BTCUSD']
        // Deterministic spread across the market-context tags so some clear the 8-trade
        // credibility gate and some deliberately do not.
        const CTX_MIX = [
          [4, 6, 8, 11], [5, 6, 9, 11], [4, 7, 8, 12], [6, 8, 11],
          [5, 7, 9, 12], [4, 6, 9, 11], [10, 7, 12], [6, 8, 11],
        ]
        const trades = Array.from({ length: 32 }, (_, i) => {
          const win = i % 3 !== 1
          return mkTrade(
            i + 1,
            i + 1,
            PAIRS[i % PAIRS.length],
            i % 2 ? 'Short' : 'Long',
            win ? 220 + (i % 7) * 130 : -180 - (i % 4) * 60,
            win ? 1.2 + (i % 5) * 0.4 : -0.9,
            win || i % 5 === 0,
            CTX_MIX[i % CTX_MIX.length],
          )
        })

        const ok = async () => true
        const list = (v) => async () => v
        window.api = {
          accounts: { getAll: list(accounts), create: ok, update: ok, delete: ok },
          strategies: {
            getAll: list(strategies), create: ok, update: ok, delete: ok,
            getPerformance: list(strategies.map((s) => ({ ...s, winRate: 56, profitFactor: 1.8, expectancy: 120, tradeCount: 40, avgRMultiple: 1.6, avgWin: 420, avgLoss: 240, planAdherence: 70, totalPnl: 4800 }))),
            getDetail: async (id) => {
              const s = strategies.find((x) => x.id === id)
              return {
                id, name: s.name, description: s.description,
                stats: { tradeCount: 40, winRate: 56, profitFactor: 1.8, expectancy: 120, totalPnl: 4800, avgRMultiple: 1.6, planAdherence: 70, avgWin: 420, avgLoss: 240 },
                equityCurve, drawdown: { series: ddSeries, maxDrawdown }, drawdownDetail: ddDetail,
                dayOfWeek: summary.dayOfWeek,
                trades: trades.map((t) => ({ id: t.id, date: t.date, name: t.name, pair: t.pair, pnl: t.pnl, followed_plan: t.followed_plan })),
              }
            },
          },
          confluences: { getAll: list(confluences), create: ok, update: ok, delete: ok },
          trades: { getAll: list(trades), create: ok, update: ok, delete: ok },
          missedTrades: { getAll: list([]), create: ok, update: ok, delete: ok },
          images: { add: ok, get: list([]), remove: ok, getAllForTrades: list([]) },
          reviews: { getAll: list([]), upsert: ok },
          analytics: {
            getSummary: async () => summary,
            getMonthlyBreakdown: list(
              Array.from({ length: 6 }, (_, i) => {
                const d = new Date(today); d.setMonth(d.getMonth() - (5 - i))
                return { month: iso(d).slice(0, 7), label: d.toLocaleDateString('en-US', { month: 'short' }), pnl: Math.round((Math.sin(i) * 3000 + 1500)), tradeCount: 30 + i * 4 }
              }),
            ),
            simulateFundedChallenge: async () => ({
              sampleSize: 5000, passRate: 62, dailyLossBreachRate: 14,
              maxDrawdownBreachRate: 24, ranOutOfDaysRate: 8, medianDaysToPass: 18,
            }),
          },
          csv: { openForImport: async () => null, import: async () => 0, export: async () => null },
          // Economic calendar. Enabled by default here so the News tab and the Home strip actually
          // render in the harness; in the real app it ships off. Fixture covers a red folder, a
          // medium, a low, an 'All' country and a Holiday (the only all-day case).
          calendar: (() => {
            const at = (dayOffset, h, m) => {
              const d = new Date(today)
              d.setDate(d.getDate() + dayOffset)
              d.setHours(h, m, 0, 0)
              // Emit a real offset so the renderer converts rather than reprinting wall clock.
              const off = -d.getTimezoneOffset()
              const sign = off >= 0 ? '+' : '-'
              const p = (n) => String(Math.floor(Math.abs(n))).padStart(2, '0')
              return `${iso(d)}T${p(h)}:${p(m)}:00${sign}${p(off / 60)}:${p(off % 60)}`
            }
            const mk = (id, dayOffset, h, m, country, impact, title, forecast, previous, allDay = 0) => ({
              id, title, country, impact, forecast, previous, all_day: allDay,
              starts_at: at(dayOffset, h, m),
              date: at(dayOffset, h, m).slice(0, 10),
            })
            const events = [
              mk(1, 0, 15, 30, 'USD', 'High', 'Non-Farm Employment Change', '185K', '142K'),
              mk(2, 0, 17, 0, 'USD', 'High', 'ISM Manufacturing PMI', '55.2', '55.6'),
              mk(3, 0, 11, 0, 'EUR', 'Medium', 'Core CPI Flash Estimate y/y', '2.4%', '2.6%'),
              mk(4, 0, 9, 30, 'GBP', 'Low', 'Final Manufacturing PMI', null, '48.9'),
              mk(5, 0, 14, 15, 'All', 'Low', 'G20 Meetings', null, null),
              mk(6, -1, 3, 0, 'GBP', 'Holiday', 'Bank Holiday', null, null, 1),
              mk(7, -1, 16, 0, 'CAD', 'High', 'BOC Rate Statement', null, null),
              mk(8, -2, 10, 30, 'JPY', 'Medium', 'Prelim Industrial Production m/m', '-0.7%', '1.3%'),
            ]
            let config = {
              enabled: true, syncOnLaunch: false,
              lastSync: new Date().toISOString(), lastError: null,
              eventCount: events.length,
              sourceUrl: 'https://nfs.faireconomy.media/ff_calendar_thisweek.json',
            }
            return {
              getConfig: async () => config,
              setEnabled: async (enabled) => { config = { ...config, enabled }; return config },
              setSyncOnLaunch: async (v) => { config = { ...config, syncOnLaunch: v }; return config },
              sync: async () => {
                config = { ...config, lastSync: new Date().toISOString(), lastError: null }
                return { ok: true, inserted: 0, updated: events.length }
              },
              getEvents: async (range) =>
                events.filter(
                  (e) => (!range?.from || e.date >= range.from) && (!range?.to || e.date <= range.to)
                ),
            }
          })(),
          obsidian: (() => {
            let config = {
              enabled: false, vaultPath: '', resolvedPath: '', defaultPath: 'C:\\Users\\demo\\Documents\\TradeJournal Vault',
              exists: false, lastSync: null, noteCount: 0,
            }
            return {
              getConfig: async () => config,
              setEnabled: async (enabled) => {
                config = { ...config, enabled, resolvedPath: enabled ? (config.vaultPath || config.defaultPath) : '', exists: enabled }
                return config
              },
              chooseVault: async () => {
                config = { ...config, enabled: true, vaultPath: 'C:\\Users\\demo\\Documents\\Demo Vault', resolvedPath: 'C:\\Users\\demo\\Documents\\Demo Vault', exists: true }
                return config
              },
              useDefaultVault: async () => {
                config = { ...config, enabled: true, vaultPath: '', resolvedPath: config.defaultPath, exists: true }
                return config
              },
              rebuild: async () => { config = { ...config, lastSync: new Date().toISOString(), noteCount: 6 }; return { ok: true, count: 6 } },
              openInObsidian: async () => {},
              showFolder: async () => {},
            }
          })(),
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
